<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Racing</title>
    <link rel="stylesheet" href="/assets/index-3965002f.css">
    <link rel="stylesheet" href="/css/all.css">
    <link rel="stylesheet" href="/style/signup.css">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div id="navbar"></div>
    <div id="friends-sec">
        <div id="race">
            <div class="chat-container">
                  <header class="chat-header">
                      <h1> Chat</h1>
                  </header>
                  <main class="chat-main">
                      <div class="chat-sidebar">
                      <h3> Room Name:</h3>
                      <h2 id="room-name"></h2>
                      <h3> Users</h3>
                      <ul id="users"></ul>
                      </div>
                      <div class="chat-messages"></div>
                  </main>
                  <div class="chat-form-container">
                      <form id="chat-form">
                      <input
                          id="msg"
                          type="text"
                          placeholder="Enter Message"
                          required
                          autocomplete="off"
                      />
                      <button class="btn"> Send</button>
                      </form>
                  </div>
              </div>

            <div class="race-cont">
                  <div class="race-status">The race is on. Type the text below:</div>
                  <div class="race-body">
                      <table>
                          <tbody id="tbody"></tbody>
                      </table>
                  </div>
                  <div class="race-text-cont">
                      <div class="given-text">
                          <p id="ptag">Loading race text...</p>
                      </div>
                      <div class="input-text">
                          <input id="ibox" autocomplete="off" />
                      </div>
                  </div>
                  <button id="back-btn">Back to Main Menu</button>
              </div>
          </div>
    </div>

    <script type="module" src="/main.js"></script>
    <script type="module" src="/scripts/friends.js"></script>
</body>
</html>
