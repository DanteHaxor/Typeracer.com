<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <title>Sign Up</title>
    <link rel="stylesheet" href="/assets/index-3965002f.css">
    <link rel="stylesheet" href="/css/all.css">
    <link rel="stylesheet" href="/style/signup.css">
    <script type="module" src="/scripts/signup.js"></script>
</head>
<body>
    <div id="navbar"></div>

    <div id="registration" class="registration reg_form">
        <h2>Create Account</h2>
        <form id="registration_form" action="">
            <div class="register_inner_div">
                <div>
                    <label for="fname">First Name *</label>
                    <input type="text" id="fname" name="fname" required>
                </div>
                <div>
                    <label for="lname">Last Name *</label>
                    <input type="text" id="lname" name="lname" required>
                </div>
            </div>
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password *</label>
            <input type="password" id="password" name="password" required>

            <input type="submit" value="Create Account" id="register">
            <hr>
            <span>Already have an account? <a href="/pages/login.html">log in.</a></span>
        </form>
    </div>

    <div id="registration_otp" class="registration otp_form">
        <h2>Email Verification</h2>
        <form id="otp_form" action="">
            <label for="otp">Enter otp received on your email *</label>
            <input type="text" id="otp" name="otp" required>
            <input type="submit" value="Validate Otp" id="register1">
        </form>
    </div>

    <script type="module" src="/main.js"></script>
</body>
</html>
